schema_version: 1
strategy: dockerfile
dockerfile: Dockerfile
run:
  port: 8083
healthcheck:
  path: /health
  port: 8083
requires:
  metrics:
    product: prometheus
    version: "2.54"
    image:
      repository: docker.io/prom/prometheus
      tag: v2.54.1
    port: 9090
    env:
      METRICS_URL: url
  db:
    product: postgres
    version: ">=15 <17"
    tenancy: database
    env:
      DATABASE_URL: url
  cache:
    product: redis
    version: ">=6"
    tenancy: db-index
    env:
      REDIS_URL: url
  queue:
    product: rabbitmq
    version: ">=4.1"
    tenancy: vhost
    env:
      RABBITMQ_URL: url
      RABBITMQ_PASSWORD: password
  auth:
    product: keycloak
    version: "26.3"
    env:
      KEYCLOAK_URL: url
  db-mongodb:
    product: mongodb
    version: ">=4.4"
    tenancy: database
    env:
      MONGODB_URL: url
env:
  - name: PORT
    default: "8083"
  - name: MAIL_API_KEY
    secret: true
  - name: MAIL_FROM
    default: "orbit@mail.infrar.io"
  - name: TASKS_QUEUE
    default: "orbit.tasks"
