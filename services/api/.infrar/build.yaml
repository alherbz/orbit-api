schema_version: 1
strategy: dockerfile
dockerfile: Dockerfile
run:
  port: 8083
healthcheck:
  path: /health
  port: 8083
requires:
  db:
    product: postgres
    version: ">=15 <17"
    tenancy: database
    env:
      DATABASE_URL: url
env:
  - name: PORT
    default: "8083"
  - name: MAIL_API_KEY
    secret: true
  - name: MAIL_FROM
    default: "orbit@mail.infrar.io"
