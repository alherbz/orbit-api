services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orbit
      MINIO_ROOT_PASSWORD: orbit-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3data:/data]

  # One-shot: the attachments bucket the API expects to exist.
  createbuckets:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 orbit orbit-secret; do sleep 1; done;
      mc mb --ignore-existing local/orbit-attachments;
      "

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: orbit-attachments
      S3_ACCESS_KEY_ID: orbit
      S3_SECRET_ACCESS_KEY: orbit-secret
      ORBIT_SIGNING_SECRET: ${ORBIT_SIGNING_SECRET:?set ORBIT_SIGNING_SECRET in .env}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      createbuckets: { condition: service_completed_successfully }

  worker:
    build: ./services/worker
    environment:
      DATABASE_URL: postgres://orbit:orbit@postgres:5432/orbit
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
  s3data:
