services:
  - name: web
    command: node --watch server.js
    cwd: ../orbit-web
    port: 3000
    environment:
      # orbit-web main strips /api; include it in the upstream base URL.
      - name: API_URL
        value: http://localhost:8083/api
  - name: stack
    command: docker compose -f docker-compose.yml -f .niteshift/files/compose.yaml up --remove-orphans
    port: 8083
    stopGracePeriod: 45s
    environment:
      - name: ORBIT_SIGNING_SECRET
        value: orbit-niteshift-local-development-signing-key
      - name: MAIL_API_KEY
        value: ""
